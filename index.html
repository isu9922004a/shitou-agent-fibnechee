<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>石頭少爺 Agent</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    background: #f4f7fb;
    color: #172033;
}
.container {
    width: min(100% - 30px, 900px);
    margin: 0 auto;
}
/* Header */
.header {
    background: linear-gradient(135deg, #0b5ed7, #164a9c);
    color: white;
    padding: 28px 0;
    box-shadow: 0 4px 15px rgba(0,0,0,.12);
}
.header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
}
.header p {
    margin: 8px 0 0;
    opacity: .9;
}
/* Search */
.search-card {
    background: white;
    margin-top: 25px;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.07);
}
.search-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
}
.search-row {
    display: flex;
    gap: 10px;
}
.stock-input {
    flex: 1;
    padding: 14px;
    border: 2px solid #dce3ee;
    border-radius: 10px;
    font-size: 18px;
    outline: none;
}
.stock-input:focus {
    border-color: #0b5ed7;
}
.search-button {
    border: none;
    background: #0b5ed7;
    color: white;
    padding: 0 25px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
}
.search-button:hover {
    background: #084da9;
}
.search-button:disabled {
    background: #9aa8bb;
    cursor: not-allowed;
}
/* Loading */
.loading {
    display: none;
    text-align: center;
    padding: 25px;
    color: #0b5ed7;
    font-weight: 700;
}
/* Error */
.error {
    display: none;
    background: #fff1f1;
    color: #b42318;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}
/* Result */
.result {
    display: none;
    margin-top: 20px;
}
/* Stock title */
.stock-header {
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 5px 20px rgba(0,0,0,.07);
    margin-bottom: 15px;
}
.stock-name {
    font-size: 26px;
    font-weight: 800;
}
.stock-code {
    color: #667085;
    margin-top: 4px;
}
/* Signal */
.signal {
    margin-top: 18px;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
}
.signal.green {
    background: #e9f8ef;
    color: #137333;
    border: 1px solid #b7e4c7;
}
.signal.yellow {
    background: #fff8df;
    color: #8a6700;
    border: 1px solid #f2d675;
}
.signal.red {
    background: #fff0f0;
    color: #b42318;
    border: 1px solid #f2b8b5;
}
/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}
.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
}
.label {
    color: #667085;
    font-size: 14px;
    margin-bottom: 7px;
}
.value {
    font-size: 25px;
    font-weight: 800;
}
.unit {
    font-size: 14px;
    margin-left: 3px;
    color: #667085;
}
/* Entry zone */
.entry-zone {
    margin-top: 15px;
    background: linear-gradient(135deg, #fff9e6, #fffdf5);
    border: 2px solid #f0cf62;
    border-radius: 18px;
    padding: 22px;
}
.entry-title {
    font-size: 18px;
    font-weight: 800;
    color: #755900;
}
.entry-value {
    font-size: 30px;
    font-weight: 900;
    margin-top: 8px;
}
/* Monthly range */
.range-card {
    margin-top: 15px;
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
}
.range-title {
    font-weight: 800;
    margin-bottom: 15px;
}
.range {
    position: relative;
    height: 14px;
    background: #e6ebf2;
    border-radius: 20px;
}
.range-fill {
    position: absolute;
    height: 100%;
    left: 0;
    right: 0;
    background: linear-gradient(90deg, #f3c34f, #0b5ed7);
    border-radius: 20px;
}
.range-price {
    display: flex;
    justify-content: space-between;
    margin-top: 9px;
    color: #667085;
    font-size: 14px;
}
/* Footer */
.footer {
    text-align: center;
    padding: 35px 0;
    color: #98a2b3;
    font-size: 13px;
}
/* Mobile */
@media (max-width: 600px) {
    .header h1 {
        font-size: 25px;
    }
    .search-row {
        flex-direction: column;
    }
    .search-button {
        padding: 14px;
    }
    .grid {
        grid-template-columns: 1fr;
    }
    .value {
        font-size: 23px;
    }
}
</style>
</head>
<body>
<header class="header">
    <div class="container">
        <h1>🪨 石頭少爺 Agent</h1>
        <p>月線波段技術分析系統</p>
    </div>
</header>
<main class="container">
    <!-- 搜尋 -->
    <section class="search-card">
        <div class="search-title">
            輸入股票代號
        </div>
        <div class="search-row">
            <input
                id="stockInput"
                class="stock-input"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="例如：2330"
                value="2330"
            >
            <button
                id="searchButton"
                class="search-button"
                onclick="analyzeStock()"
            >
                開始分析
            </button>
        </div>
        <div id="error" class="error"></div>
        <div id="loading" class="loading">
            ⏳ 正在取得股票資料...
        </div>
    </section>
    <!-- 分析結果 -->
    <section id="result" class="result">
        <div class="stock-header">
            <div id="stockName" class="stock-name">
                -
            </div>
            <div id="stockCode" class="stock-code">
                -
            </div>
            <div id="signal" class="signal">
                -
            </div>
        </div>
        <!-- 技術資料 -->
        <div class="grid">
            <div class="card">
                <div class="label">
                    今日收盤價
                </div>
                <div class="value">
                    <span id="close">-</span>
                    <span class="unit">元</span>
                </div>
            </div>
            <div class="card">
                <div class="label">
                    月線 20MA
                </div>
                <div class="value">
                    <span id="ma20">-</span>
                    <span class="unit">元</span>
                </div>
            </div>
            <div class="card">
                <div class="label">
                    月線最高價
                </div>
                <div class="value">
                    <span id="monthHigh">-</span>
                    <span class="unit">元</span>
                </div>
            </div>
            <div class="card">
                <div class="label">
                    月線最低價
                </div>
                <div class="value">
                    <span id="monthLow">-</span>
                    <span class="unit">元</span>
                </div>
            </div>
            <div class="card">
                <div class="label">
                    RSI
                </div>
                <div class="value">
                    <span id="rsi">-</span>
                </div>
            </div>
            <div class="card">
                <div class="label">
                    月線收盤
                </div>
                <div class="value">
                    <span id="monthClose">-</span>
                    <span class="unit">元</span>
                </div>
            </div>
        </div>
        <!-- 建倉區 -->
        <div class="entry-zone">
            <div class="entry-title">
                🎯 石頭少爺建倉區
            </div>
            <div id="entryZone" class="entry-value">
                -
            </div>
        </div>
        <!-- 月線區間 -->
        <div class="range-card">
            <div class="range-title">
                📊 月線價格區間
            </div>
            <div class="range">
                <div class="range-fill"></div>
            </div>
            <div class="range-price">
                <span>
                    最低：
                    <strong id="rangeLow">-</strong>
                </span>
                <span>
                    最高：
                    <strong id="rangeHigh">-</strong>
                </span>
            </div>
        </div>
    </section>
</main>
<footer class="footer">
    石頭少爺 Agent<br>
    技術分析僅供研究與決策參考
</footer>
<script>
/*
|--------------------------------------------------------------------------
| Cloudflare Worker API
|--------------------------------------------------------------------------
*/
const API_BASE_URL =
    "https://shitou-agent-api.d318426.workers.dev";
/*
|--------------------------------------------------------------------------
| 工具：安全取得數字
|--------------------------------------------------------------------------
*/
function numberValue(value) {
    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }
    const number = Number(value);
    return Number.isFinite(number)
        ? number
        : null;
}
/*
|--------------------------------------------------------------------------
| 工具：格式化數字
|--------------------------------------------------------------------------
*/
function formatNumber(value, digits = 2) {
    const number = numberValue(value);
    if (number === null) {
        return "-";
    }
    return number.toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits: digits,
            maximumFractionDigits: digits
        }
    );
}
/*
|--------------------------------------------------------------------------
| 取得欄位
|--------------------------------------------------------------------------
|
| Worker 未來如果稍微調整 JSON 欄位名稱，
| 這裡也可以兼容。
|
*/
function getField(data, names) {
    for (const name of names) {
        if (
            data[name] !== undefined &&
            data[name] !== null
        ) {
            return data[name];
        }
    }
    return null;
}
/*
|--------------------------------------------------------------------------
| 開始分析
|--------------------------------------------------------------------------
*/
async function analyzeStock() {
    const input =
        document.getElementById("stockInput");
    const button =
        document.getElementById("searchButton");
    const loading =
        document.getElementById("loading");
    const error =
        document.getElementById("error");
    const result =
        document.getElementById("result");
    const stock =
        input.value.trim();
    /*
    | 股票代號驗證
    */
    if (!/^\d{4,6}$/.test(stock)) {
        error.style.display = "block";
        error.innerText =
            "請輸入正確的股票代號，例如 2330。";
        result.style.display = "none";
        return;
    }
    /*
    | 初始化畫面
    */
    error.style.display = "none";
    result.style.display = "none";
    loading.style.display = "block";
    button.disabled = true;
    button.innerText = "分析中...";
    try {
        /*
        | 建立 API URL
        */
        const url =
            ${API_BASE_URL}/?stock=${encodeURIComponent(stock)};
        /*
        | 呼叫 Cloudflare Worker
        */
        const response =
            await fetch(url, {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                },
                cache: "no-store"
            });
        /*
        | HTTP 錯誤
        */
        if (!response.ok) {
            throw new Error(
                API 回應錯誤：HTTP ${response.status}
            );
        }
        /*
        | 解析 JSON
        */
        const data =
            await response.json();
        console.log(
            "石頭少爺 Agent API:",
            data
        );
        /*
        | 取得資料
        */
        const name =
            getField(
                data,
                [
                    "name",
                    "stockName",
                    "stock_name",
                    "股票名稱"
                ]
            );
        const code =
            getField(
                data,
                [
                    "stock",
                    "code",
                    "symbol",
                    "股票代號"
                ]
            ) || stock;
        const close =
            getField(
                data,
                [
                    "close",
                    "price",
                    "收盤價"
                ]
            );
        const ma20 =
            getField(
                data,
                [
                    "ma20",
                    "MA20",
                    "month20MA",
                    "月線20MA"
                ]
            );
        const monthClose =
            getField(
                data,
                [
                    "monthClose",
                    "month_close",
                    "monthlyClose",
                    "月線收盤"
                ]
            );
        const monthHigh =
            getField(
                data,
                [
                    "monthHigh",
                    "month_high",
                    "monthlyHigh",
                    "月線最高"
                ]
            );
        const monthLow =
            getField(
                data,
                [
                    "monthLow",
                    "month_low",
                    "monthlyLow",
                    "月線最低"
                ]
            );
        const rsi =
            getField(
                data,
                [
                    "rsi",
                    "RSI"
                ]
            );
        const entry =
            getField(
                data,
                [
                    "entry",
                    "建倉區"
                ]
            );
        const stage =
            getField(
                data,
                [
                    "stage",
                    "phase",
                    "階段"
                ]
            );
        /*
        | 股票名稱
        */
        document.getElementById(
            "stockName"
        ).innerText =
            name || 股票 ${code};
        document.getElementById(
            "stockCode"
        ).innerText =
            股票代號：${code};
        /*
        | 技術資料
        */
        document.getElementById(
            "close"
        ).innerText =
            formatNumber(close);
        document.getElementById(
            "ma20"
        ).innerText =
            formatNumber(ma20);
        document.getElementById(
            "monthHigh"
        ).innerText =
            formatNumber(monthHigh);
        document.getElementById(
            "monthLow"
        ).innerText =
            formatNumber(monthLow);
        document.getElementById(
            "monthClose"
        ).innerText =
            formatNumber(monthClose);
        document.getElementById(
            "rsi"
        ).innerText =
            formatNumber(rsi, 1);
        /*
        | 建倉區
        */
        let entryText = "-";
        if (
            typeof entry === "string" ||
            typeof entry === "number"
        ) {
            entryText = entry;
        }
        else if (entry === true) {
            entryText = "符合建倉條件";
        }
        document.getElementById(
            "entryZone"
        ).innerText =
            entryText;
        /*
        | 月線價格區間
        */
        document.getElementById(
            "rangeLow"
        ).innerText =
            formatNumber(monthLow);
        document.getElementById(
            "rangeHigh"
        ).innerText =
            formatNumber(monthHigh);
        /*
        | 訊號判斷
        */
        const signal =
            document.getElementById("signal");
        signal.className =
            "signal";
        const entryBoolean =
            getField(
                data,
                [
                    "entry",
                    "進場"
                ]
            );
        /*
        | 優先使用 Worker 的 stage
        */
        if (
            entryBoolean === true ||
            stage === "建倉區"
        ) {
            signal.classList.add("green");
            signal.innerText =
                "🟢 符合條件｜目前位於建倉區";
        }
        else if (
            stage === "觀察區" ||
            stage === "觀察"
        ) {
            signal.classList.add("yellow");
            signal.innerText =
                "🟡 觀察等待";
        }
        else {
            signal.classList.add("red");
            signal.innerText =
                "🔴 暫不進場";
        }
        /*
        | 顯示結果
        */
        result.style.display = "block";
    }
    catch (err) {
        console.error(err);
        error.style.display = "block";
        error.innerText =
            "無法取得股票資料。請確認 Cloudflare Worker 是否正常運作，以及 API 是否允許 GitHub Pages 跨網域呼叫。";
    }
    finally {
        loading.style.display = "none";
        button.disabled = false;
        button.innerText = "開始分析";
    }
}
/*
|--------------------------------------------------------------------------
| Enter 鍵直接分析
|--------------------------------------------------------------------------
*/
document
    .getElementById("stockInput")
    .addEventListener(
        "keydown",
        function(event) {
            if (event.key === "Enter") {
                analyzeStock();
            }
        }
    );
/*
|--------------------------------------------------------------------------
| 頁面開啟時自動分析 2330
|--------------------------------------------------------------------------
*/
window.addEventListener(
    "load",
    function() {
        analyzeStock();
    }
);
</script>
</body>
</html>
